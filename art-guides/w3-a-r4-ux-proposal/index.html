<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Proposta navegável e isolada para a reforma mobile-first R4 da Biblioteca Viva."
    />
    <title>Biblioteca Viva — Proposta UX R4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#proposal-main">Ir para a tela proposta</a>

    <section class="review-bar" aria-label="Controles exclusivos do protótipo">
      <strong>PROPOSTA R4</strong>
      <label>
        Tela
        <select id="review-screen">
          <option value="library">Biblioteca</option>
          <option value="library-loading">Biblioteca · carregando</option>
          <option value="library-error">Biblioteca · erro</option>
          <option value="library-canvas">Biblioteca · sem canvas</option>
          <option value="collection">Coleção</option>
          <option value="collection-empty">Coleção · vazia</option>
          <option value="editor">Cadastro/edição</option>
          <option value="detail">Detalhe</option>
          <option value="session">Sessão ativa</option>
          <option value="archive">Arquivo</option>
          <option value="statistics">Estatísticas</option>
          <option value="settings">Ajustes</option>
          <option value="backup">Backup</option>
          <option value="construction-explore">Construção · explorar</option>
          <option value="construction-palette">Construção · palette</option>
          <option value="construction-placing">Construção · colocar</option>
          <option value="construction-select">Construção · selecionar</option>
          <option value="construction-moving">Construção · mover</option>
          <option value="construction-floor">Construção · piso</option>
          <option value="construction-confirm">Construção · confirmação</option>
        </select>
      </label>
      <button id="review-contrast" type="button" aria-pressed="false">
        Alto contraste
      </button>
      <button id="review-text" type="button" aria-pressed="false">
        Texto maior
      </button>
      <a href="README.md">Guia</a>
    </section>

    <div class="prototype-frame" id="prototype-frame">
      <div class="app-shell" id="proposal-app">
        <header class="app-header" id="proposal-header"></header>
        <div id="session-ribbon"></div>
        <main id="proposal-main" tabindex="-1"></main>
        <nav class="bottom-nav" aria-label="Navegação principal">
          <button type="button" data-nav="library" aria-label="Biblioteca">
            <span aria-hidden="true" class="nav-icon nav-icon--library">⌂</span>
            <span>Biblioteca</span>
          </button>
          <button type="button" data-nav="collection" aria-label="Coleção">
            <span aria-hidden="true" class="nav-icon nav-icon--collection"
              >▤</span
            >
            <span>Coleção</span>
          </button>
          <button type="button" data-nav="archive" aria-label="Arquivo">
            <span aria-hidden="true" class="nav-icon nav-icon--archive">❞</span>
            <span>Arquivo</span>
          </button>
          <button type="button" data-nav="statistics" aria-label="Estatísticas">
            <span aria-hidden="true" class="nav-icon nav-icon--statistics"
              >⌁</span
            >
            <span>Resumo</span>
          </button>
          <button type="button" data-nav="settings" aria-label="Ajustes">
            <span aria-hidden="true" class="nav-icon nav-icon--settings"
              >⚙</span
            >
            <span>Ajustes</span>
          </button>
        </nav>
        <div id="overlay-root"></div>
        <div
          class="toast-region"
          aria-live="polite"
          aria-atomic="true"
          id="toast-region"
        ></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
