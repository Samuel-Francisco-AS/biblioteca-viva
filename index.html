<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' blob: ws://localhost:5173 ws://127.0.0.1:5173; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Fundação técnica do aplicativo Biblioteca Viva"
    />
    <title>Biblioteca Viva</title>
  </head>
  <body>
    <style>
      #bv-startup-veil {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        padding: 2rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
        background: radial-gradient(ellipse at 50% 35%, #422a40, #201729 69%, #17131f);
        color: #f5e2c4;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        transition: opacity 240ms ease;
      }
      #bv-startup-veil.bv-startup-veil--leaving {
        opacity: 0;
        pointer-events: none;
      }
      .bv-startup-book {
        display: grid;
        place-items: center;
        width: 5.5rem;
        height: 7.2rem;
        margin: 0 auto 1.5rem;
        border: 3px double #c7a77d;
        border-radius: 0.25rem 0.9rem 0.25rem 0.65rem;
        background: linear-gradient(135deg, #54334d, #2d2139);
        box-shadow: inset 0 0 0 6px #261b31, 5px 7px 0 #100e1a77;
        font-size: 2.3rem;
        color: #dfbd97;
      }
      .bv-startup-title {
        margin: 0 0 0.65rem;
        font-size: clamp(1.45rem, 6vw, 2.1rem);
        letter-spacing: 0.015em;
      }
      .bv-startup-stage {
        color: #dfc8be;
        font: 0.92rem/1.6 system-ui, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        #bv-startup-veil { transition: none; }
      }
    </style>
    <div id="root"></div>
    <div id="bv-startup-veil" role="status" aria-live="polite" aria-label="Preparando a Biblioteca Viva">
      <div>
        <div class="bv-startup-book" aria-hidden="true">✧</div>
        <p class="bv-startup-title">Biblioteca Viva</p>
        <p id="bv-startup-stage" class="bv-startup-stage">Abrindo o Códice Iluminado…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
