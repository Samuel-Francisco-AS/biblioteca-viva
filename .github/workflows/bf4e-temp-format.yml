name: BF4E temporary formatter
on:
  push:
    branches:
      - feat/bf-4e-living-objects
permissions:
  contents: write
jobs:
  format:
    if: "startsWith(github.event.head_commit.message, 'chore(BF-4E): run one-time formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format affected BF4E sources and publish
        run: |
          set -eu
          npx prettier --write src/features/library/livingObjects.test.ts src/features/library/three/ThreeWorldInteraction.ts e2e/bf4-living.spec.ts
          git diff --check
          git diff -- src/features/library/livingObjects.test.ts src/features/library/three/ThreeWorldInteraction.ts e2e/bf4-living.spec.ts
          git add src/features/library/livingObjects.test.ts src/features/library/three/ThreeWorldInteraction.ts e2e/bf4-living.spec.ts
          if ! git diff --cached --quiet; then
            git -c user.name="BF4E Formatter" -c user.email="bf4e-formatter@users.noreply.github.com" commit -m "style(BF-4E): apply project Prettier"
            git push origin HEAD:feat/bf-4e-living-objects
          fi
