name: BF-5R3 temporary formatter
on:
  push:
    branches:
      - feat/bf-5-uiux-global-rework
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed BF-5R3 sources
        run: npx prettier --write src/features/collection/CollectionPage.tsx src/features/entry-detail/EntryDetailPage.tsx src/features/library/three/cameraMath.ts src/features/library/three/cameraMath.test.ts src/features/library/three/ThreeWorldRuntime.ts src/app/RealmIntro.tsx src/styles-ritual.css e2e/bf5-ritual.spec.ts
      - name: Push formatting-only commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/collection/CollectionPage.tsx src/features/entry-detail/EntryDetailPage.tsx src/features/library/three/cameraMath.ts src/features/library/three/cameraMath.test.ts src/features/library/three/ThreeWorldRuntime.ts src/app/RealmIntro.tsx src/styles-ritual.css e2e/bf5-ritual.spec.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(BF-5R3): format visual and camera changes"
            git push origin HEAD:feat/bf-5-uiux-global-rework
          fi
