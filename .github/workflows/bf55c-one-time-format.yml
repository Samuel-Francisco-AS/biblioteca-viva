name: BF-5.5C one-time format

on:
  push:
    branches:
      - feat/bf-5-5c-night-lighting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BF-5.5C candidate once
        run: |
          npx prettier --write \
            src/features/library/inhabitantAgency.test.ts \
            src/features/library/inhabitantAgency.ts \
            src/features/library/nightLighting.test.ts \
            src/features/library/nightLighting.ts \
            src/features/library/three/livingVisuals.test.ts \
            src/features/library/three/livingVisuals.ts \
            src/features/library/WorldHost.tsx \
            src/infrastructure/database/nightLightingRepository.test.ts \
            src/infrastructure/database/nightLightingRepository.ts \
            .github/workflows/bf55c-one-time-format.yml
          git add -- src/features/library/inhabitantAgency.test.ts src/features/library/inhabitantAgency.ts src/features/library/nightLighting.test.ts src/features/library/nightLighting.ts src/features/library/three/livingVisuals.test.ts src/features/library/three/livingVisuals.ts src/features/library/WorldHost.tsx src/infrastructure/database/nightLightingRepository.test.ts src/infrastructure/database/nightLightingRepository.ts .github/workflows/bf55c-one-time-format.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='Biblioteca Viva CI' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'style(BF-5.5C): apply Prettier to night-lighting candidate'
            git push origin HEAD:refs/heads/feat/bf-5-5c-night-lighting
          fi
