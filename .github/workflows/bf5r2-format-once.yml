name: BF-5R2 one-shot prettier
on:
  push:
    branches:
      - feat/bf-5-uiux-global-rework
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/styles-touch.css
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles-touch.css
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(BF-5R2): normalize tactile CSS"
            git push origin HEAD:feat/bf-5-uiux-global-rework
          fi
