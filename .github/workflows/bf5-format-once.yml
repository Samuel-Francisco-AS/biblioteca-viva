name: BF-5R1 temporary formatting
on:
  push:
    branches:
      - feat/bf-5-uiux-global-rework
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only the BF-5R1 changed sources
        run: npx prettier --write src/app/RealmIntro.tsx src/pages.test.tsx src/pages.tsx src/styles-arcane.css e2e/bf5-rpg-hud.spec.ts e2e/reading-area.spec.ts
      - name: Commit formatted files to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/RealmIntro.tsx src/pages.test.tsx src/pages.tsx src/styles-arcane.css e2e/bf5-rpg-hud.spec.ts e2e/reading-area.spec.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(BF-5R1): normalize source formatting"
            git push origin HEAD:feat/bf-5-uiux-global-rework
          fi
