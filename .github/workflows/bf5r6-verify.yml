name: BF-5R6 native and formatting verification
on:
  push:
    branches:
      - feat/bf-5-uiux-global-rework
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize BF-5R6 sources
        run: |
          npx prettier --write src/App.tsx src/app/PrimaryDock.tsx src/app/RealmIntro.tsx src/app/RealmIntro.test.tsx src/app/touchFeedback.ts src/features/entry-editor/NewEntryPage.tsx src/features/entry-editor/RitualFields.tsx src/features/entry-editor/WorkoutFields.tsx src/styles-atelier.css e2e/bf5-r6-manuscript.spec.ts .github/workflows/bf5r6-verify.yml
      - name: Commit source formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/app/PrimaryDock.tsx src/app/RealmIntro.tsx src/app/RealmIntro.test.tsx src/app/touchFeedback.ts src/features/entry-editor/NewEntryPage.tsx src/features/entry-editor/RitualFields.tsx src/features/entry-editor/WorkoutFields.tsx src/styles-atelier.css e2e/bf5-r6-manuscript.spec.ts .github/workflows/bf5r6-verify.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(BF-5R6): normalize manuscript and haptic sources"
            git push origin HEAD:feat/bf-5-uiux-global-rework
          fi
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble Android debug APK with native tactile bridge
        run: npm run android:build:debug
      - name: APK integrity
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
