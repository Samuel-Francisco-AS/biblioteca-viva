name: BF-5.5F one-time Prettier

on:
  push:
    branches:
      - feat/bf-5-5f-real-session-response

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only BF-5.5F bridge files
        run: |
          npx prettier --write src/pages.tsx src/features/library/three/sessionWorldVisuals.test.ts
          git add -- src/pages.tsx src/features/library/three/sessionWorldVisuals.test.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name='Biblioteca Viva CI' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'style(BF-5.5F): apply Prettier to reactive session bridge'
            git push origin HEAD:refs/heads/feat/bf-5-5f-real-session-response
          fi
