name: BF4E one-time hotfix formatting
on:
  push:
    branches:
      - feat/bf-4e-living-objects
permissions:
  contents: write
jobs:
  format:
    if: "startsWith(github.event.head_commit.message, 'chore(BF-4E): format post-gate hotfix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the BF4E hotfix sources and publish
        run: |
          set -eu
          npx prettier --write src/features/library/three/ThreeWorldInteraction.ts src/features/library/three/smallLivingTapTargets.ts src/features/library/three/smallLivingTapTargets.test.ts src/features/library/three/livingVisuals.ts src/features/library/three/livingVisuals.test.ts src/features/library/LivingControls.tsx src/features/library/LivingFeedback.test.tsx src/styles.css
          git diff --check
          git add src/features/library/three/ThreeWorldInteraction.ts src/features/library/three/smallLivingTapTargets.ts src/features/library/three/smallLivingTapTargets.test.ts src/features/library/three/livingVisuals.ts src/features/library/three/livingVisuals.test.ts src/features/library/LivingControls.tsx src/features/library/LivingFeedback.test.tsx src/styles.css
          if ! git diff --cached --quiet; then
            git -c user.name="BF4E Formatter" -c user.email="bf4e-formatter@users.noreply.github.com" commit -m "style(BF-4E): apply project Prettier to post-gate fixes"
            git push origin HEAD:feat/bf-4e-living-objects
          fi
