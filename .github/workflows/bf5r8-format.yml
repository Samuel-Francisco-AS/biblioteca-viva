name: BF-5R8 one-time formatter
on:
  push:
    branches: [feat/bf-5-uiux-global-rework]
    paths:
      - .github/workflows/bf5r8-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/App.tsx src/features/collection/CollectionPage.tsx src/styles-atelier.css index.html
      - name: Commit formatter output if needed
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Biblioteca Viva automation"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/features/collection/CollectionPage.tsx src/styles-atelier.css index.html
            git commit -m "style(BF-5R8): format progressive UI changes"
            git push origin HEAD:feat/bf-5-uiux-global-rework
          fi
